<main>
  <h1>Mis metas de vida</h1>

  <form (ngSubmit)="agregarMeta()">
    <input
      type="text"
      [(ngModel)]="nuevaMeta"
      name="nuevaMeta"
      placeholder="Escribe una nueva meta..."
    />
    <button type="submit">Agregar</button>
  </form>

  <ul>
    <li *ngFor="let item of metas">
      <span>{{ item.meta }}</span>
      <button (click)="eliminarMeta(item.id)">Eliminar</button>
    </li>
  </ul>
</main>
